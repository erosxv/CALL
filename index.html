<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallZinha - Chamada em grupo</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #eaeaea;
    min-height: 100vh;
  }
  /* ---- Tela de entrada ---- */
  #joinScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  #joinScreen h1 { font-size: 28px; margin-bottom: 8px; }
  #joinScreen p.sub { color: #9aa0a6; margin-bottom: 28px; text-align: center; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 380px;
  }
  .card label { display: block; font-size: 13px; color: #9aa0a6; margin-bottom: 6px; margin-top: 16px; }
  .card label:first-child { margin-top: 0; }
  .card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e37;
    background: #0f1115;
    color: #eaeaea;
    font-size: 15px;
  }
  .card input:focus { outline: 2px solid #5b8cff; }
  .row-btns { display: flex; gap: 10px; margin-top: 22px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    transition: opacity .15s ease;
  }
  button:hover { opacity: .88; }
  button:active { opacity: .7; }
  .btn-primary { background: #5b8cff; color: white; flex: 1; }
  .btn-ghost { background: #2a2e37; color: #eaeaea; }
  #genRoomBtn { width: 100%; margin-top: 6px; }
  #status { margin-top: 16px; font-size: 13px; color: #9aa0a6; text-align: center; min-height: 18px; }

  /* ---- Tela da chamada ---- */
  #callScreen { display: none; min-height: 100vh; flex-direction: column; }
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #14161c;
    border-bottom: 1px solid #2a2e37;
  }
  #topbar .roomInfo { font-size: 14px; color: #9aa0a6; }
  #topbar .roomInfo b { color: #eaeaea; }
  #copyLinkBtn { background: #2a2e37; color: #eaeaea; font-size: 13px; padding: 8px 12px; }

  #mediaBanner {
    background: #20161a;
    border-bottom: 1px solid #d64545;
    padding: 10px 20px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    padding: 16px;
    overflow-y: auto;
    align-content: start;
  }
  .tile {
    position: relative;
    background: #14161c;
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 16/10;
    border: 1px solid #2a2e37;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    display: none;
  }
  .tile video.has-video { display: block; }
  .tile .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #2a2e37;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: #9aa0a6;
  }
  .tile.avatar-tile { }
  .tile .tag {
    position: absolute;
    left: 10px;
    bottom: 10px;
    background: rgba(0,0,0,.55);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .tile .vol-control {
    position: absolute;
    right: 8px;
    top: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,0,0,.55);
    padding: 4px 8px;
    border-radius: 8px;
  }
  .tile .vol-control span { font-size: 12px; }
  .tile .vol-control input[type="range"] {
    width: 60px;
    accent-color: #5b8cff;
    cursor: pointer;
  }
  .tile .screen-badge {
    position: absolute;
    left: 10px;
    top: 10px;
    background: rgba(91,140,255,.9);
    padding: 3px 8px;
    border-radius: 8px;
    font-size: 11px;
    display: none;
  }
  .tile .fs-btn {
    position: absolute;
    right: 8px;
    bottom: 12px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(0,0,0,.6);
    color: #eaeaea;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    padding: 0;
    border: none;
    cursor: pointer;
    z-index: 3;
  }
  .tile .fs-btn.show { display: flex; }
  .tile .fs-btn:hover { background: rgba(0,0,0,.8); opacity: 1; }
  .tile:fullscreen, video:fullscreen { object-fit: contain; background: #000; }
  .tile .pip-btn {
    position: absolute;
    right: 46px;
    bottom: 12px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(0,0,0,.6);
    color: #eaeaea;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    padding: 0;
    border: none;
    cursor: pointer;
    z-index: 3;
  }
  .tile .pip-btn.show { display: flex; }
  .tile .pip-btn.active { background: rgba(91,140,255,.9); }
  .tile .pip-btn:hover { background: rgba(0,0,0,.8); opacity: 1; }
  .tile .volbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: #1a1d24;
  }
  .tile .volfill {
    height: 100%;
    width: 0%;
    background: #5b8cff;
    transition: width .08s linear;
  }
  .tile.speaking { border-color: #5b8cff; box-shadow: 0 0 0 2px #5b8cff55; }

  #controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: #14161c;
    border-top: 1px solid #2a2e37;
  }
  .ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #2a2e37;
    color: #eaeaea;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .ctrl-btn.off { background: #d64545; }
  .ctrl-btn.active { background: #5b8cff; }
  .ctrl-btn.leave { background: #d64545; }
  .ctrl-btn.noise-on { background: #22b07d; }
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1d24;
    border: 1px solid #2a2e37;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    max-width: 90vw;
    text-align: center;
  }
  #noisePanel {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1d24;
    border: 1px solid #2a2e37;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
    z-index: 10;
    width: 300px;
    max-width: 90vw;
    text-align: left;
  }
  #noisePanel.show { display: block; }
  #noisePanel .np-section { margin-bottom: 16px; }
  #noisePanel .np-section:last-child { margin-bottom: 0; }
  #noisePanel label { display: block; color: #9aa0a6; margin-bottom: 8px; }
  #noisePanel select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2a2e37;
    background: #0f1115;
    color: #eaeaea;
    font-size: 13px;
  }
  .mode-row { display: flex; gap: 6px; }
  .mode-row button {
    flex: 1;
    padding: 8px 4px;
    font-size: 11px;
    background: #2a2e37;
    color: #9aa0a6;
    border-radius: 8px;
  }
  .mode-row button.active { background: #22b07d; color: #fff; }
  .meter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meter-row span { width: 42px; font-size: 11px; color: #9aa0a6; }
  .meter-bar { flex: 1; height: 8px; border-radius: 4px; background: #0f1115; overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; transition: width .08s linear; }
  .meter-fill.mic { background: #5b8cff; }
  .meter-fill.noise { background: #d68a45; }
  .meter-fill.voice { background: #22b07d; }
</style>
</head>
<body>

<div id="joinScreen">
  <h1>📞 CallZinha</h1>
  <p class="sub">Chamada em grupo por áudio, com tela compartilhada</p>
  <div class="card">
    <label for="nameInput">Seu nome</label>
    <input id="nameInput" placeholder="Ex: João" maxlength="20">
    <label for="roomInput">Código da sala</label>
    <input id="roomInput" placeholder="Ex: turma-do-cafe" maxlength="40">
    <button id="genRoomBtn" class="btn-ghost">🎲 Gerar código novo</button>
    <div class="row-btns">
      <button id="joinBtn" class="btn-primary">Entrar na chamada</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="callScreen">
  <div id="topbar">
    <div class="roomInfo">Sala: <b id="roomLabel"></b> &nbsp;•&nbsp; <span id="peerCount">1</span> na chamada</div>
    <button id="copyLinkBtn">🔗 Copiar link de convite</button>
  </div>
  <div id="grid"></div>
  <div id="controls">
    <button id="micBtn" class="ctrl-btn active" title="Mutar/desmutar (tecla M)">🎤</button>
    <button id="screenBtn" class="ctrl-btn" title="Compartilhar tela">🖥️</button>
    <button id="noiseBtn" class="ctrl-btn noise-on" title="Filtro de ruído (clique: liga/desliga · duplo clique: abrir configurações)">🔉</button>
    <button id="leaveBtn" class="ctrl-btn leave" title="Sair">📵</button>
  </div>
  <div style="text-align:center;font-size:11px;color:#6b7280;padding-bottom:10px;background:#14161c;">Atalho: tecla <b>M</b> muta/desmuta</div>
</div>

<div id="toast"></div>
<div id="noisePanel">
  <div class="np-section">
    <label>Modo de supressão de ruído</label>
    <div id="noiseModes" class="mode-row">
      <button data-mode="off">OFF</button>
      <button data-mode="low">LOW</button>
      <button data-mode="medium" class="active">MED</button>
      <button data-mode="high">HIGH</button>
      <button data-mode="auto">AUTO</button>
    </div>
  </div>
  <div class="np-section">
    <label for="micDeviceSelect">Microfone</label>
    <select id="micDeviceSelect"><option value="">Padrão do sistema</option></select>
  </div>
  <div class="np-section">
    <div class="meter-row"><span>MIC</span><div class="meter-bar"><div id="meterMic" class="meter-fill mic"></div></div></div>
    <div class="meter-row"><span>RUÍDO</span><div class="meter-bar"><div id="meterNoise" class="meter-fill noise"></div></div></div>
    <div class="meter-row"><span>VOZ</span><div class="meter-bar"><div id="meterVoice" class="meter-fill voice"></div></div></div>
  </div>
  <div class="np-section">
    <button id="micTestBtn" class="btn-ghost" style="width:100%;">🎙️ Testar: original x processado</button>
    <div id="micTestResult" style="display:none;margin-top:8px;">
      <div style="display:flex;gap:8px;">
        <button id="playOriginalBtn" class="btn-ghost" style="flex:1;font-size:12px;padding:8px;">▶ Original</button>
        <button id="playProcessedBtn" class="btn-ghost" style="flex:1;font-size:12px;padding:8px;">▶ Processado</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let myName = "";
let roomId = "";
let peer = null;
let isHost = false;
let localStream = null;   // stream de ÁUDIO bruto do mic
let micOutputStream = null; // stream já processado (com ganho aplicado) que vai pra chamada
let micGainNode = null;
let micVolumePercent = 100; // 0-200%
let noiseMode = 'medium';   // off | low | medium | high | auto
let lastActiveNoiseMode = 'medium';
let noiseHighpass = null;
let micRawSourceNode = null;
let voiceGateNode = null;    // AudioWorkletNode (quando o navegador suporta)
let fallbackGateNode = null; // ScriptProcessorNode (fallback quando não suporta AudioWorklet)
let compressorNode = null;
let limiterNode = null;
let meterState = { floor: 0.001, speaking: false }; // alimentado pelo worklet/fallback
const latestLevels = {}; // tileId -> nível de volume 0-1 (preenchido pelo attachVolumeMeter)
let selectedMicDeviceId = null;
let micTestRawSource = null;
let micTestOriginalUrl = null;
let micTestProcessedUrl = null;
let mixDestination = null;   // destino único onde mic + áudio da tela são misturados
let screenAudioSource = null;
let screenAudioGain = null;

// ---- Worklet de supressão de ruído (roda fora da thread principal) ----
// Faz: envelope de voz (attack/release), estimativa adaptativa do "chão" de ruído
// (sobe devagar com ruído contínuo tipo ventilador/ar-condicionado, desce rápido
// quando fica quieto), e um "tempo de confirmação" antes de abrir o gate de vez —
// isso é o que evita abrir a porta pra um clique de teclado/mouse (que passa rápido
// demais pra confirmar) mas abre pra voz (que sustenta o sinal).
const NOISE_WORKLET_CODE = `
class VoiceGateProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    const sr = sampleRate;
    this.sr = sr;
    this.attackCoef = 1 - Math.exp(-1 / (0.005 * sr));
    this.releaseCoef = 1 - Math.exp(-1 / (0.120 * sr));
    this.floorAttackCoef = 1 - Math.exp(-1 / (2.0 * sr));
    this.floorReleaseCoef = 1 - Math.exp(-1 / (0.4 * sr));
    this.gainUpCoef = 1 - Math.exp(-1 / (0.008 * sr));
    this.gainDownCoef = 1 - Math.exp(-1 / (0.180 * sr));
    this.envelope = 0; this.floor = 0.003; this.currentGain = 1;
    this.holdCounter = 0; this.confirmCounter = 0; this.frameCount = 0;
    this.mode = 'medium';
    this.port.onmessage = (e) => {
      if (e.data && e.data.type === 'config') this.mode = e.data.mode;
    };
  }
  paramsForMode() {
    switch (this.mode) {
      case 'low':  return { ratio: 1.6, floorGain: 0.35, holdMs: 300, confirmMs: 8 };
      case 'high': return { ratio: 3.2, floorGain: 0.05, holdMs: 200, confirmMs: 20 };
      case 'auto': return this._autoParams || { ratio: 2.2, floorGain: 0.15, holdMs: 260, confirmMs: 14 };
      default:     return { ratio: 2.2, floorGain: 0.15, holdMs: 260, confirmMs: 14 };
    }
  }
  process(inputs, outputs) {
    const input = inputs[0][0];
    const output = outputs[0][0];
    if (!input || !output) return true;
    if (this.mode === 'off') {
      output.set(input);
      this.frameCount++;
      if (this.frameCount % 4 === 0) this.port.postMessage({ floor: this.floor, speaking: false });
      return true;
    }
    if (this.mode === 'auto') {
      const noisy = this.floor > 0.012, veryNoisy = this.floor > 0.03;
      this._autoParams = veryNoisy ? { ratio: 3.0, floorGain: 0.08, holdMs: 220, confirmMs: 18 }
        : noisy ? { ratio: 2.4, floorGain: 0.15, holdMs: 250, confirmMs: 14 }
        : { ratio: 1.8, floorGain: 0.30, holdMs: 300, confirmMs: 8 };
    }
    const p = this.paramsForMode();
    const holdMax = Math.round((p.holdMs / 1000) * this.sr);
    const confirmMax = Math.max(1, Math.round((p.confirmMs / 1000) * this.sr));
    let speaking = false;
    for (let i = 0; i < input.length; i++) {
      const level = Math.abs(input[i]);
      this.envelope = level > this.envelope
        ? this.envelope + (level - this.envelope) * this.attackCoef
        : this.envelope + (level - this.envelope) * this.releaseCoef;
      const aboveFloorNow = this.envelope > this.floor * p.ratio;
      if (!aboveFloorNow) this.floor += (this.envelope - this.floor) * this.floorAttackCoef;
      else this.floor += (Math.min(this.envelope, this.floor) - this.floor) * this.floorReleaseCoef;
      if (this.floor < 0.0008) this.floor = 0.0008;
      const overThreshold = this.envelope >= this.floor * p.ratio;
      this.confirmCounter = overThreshold ? Math.min(this.confirmCounter + 1, confirmMax) : 0;
      const confirmed = this.confirmCounter >= confirmMax;
      if (confirmed) { this.holdCounter = holdMax; speaking = true; }
      else if (this.holdCounter > 0) this.holdCounter--;
      const targetGain = (confirmed || this.holdCounter > 0) ? 1 : p.floorGain;
      this.currentGain += (targetGain - this.currentGain) * (targetGain > this.currentGain ? this.gainUpCoef : this.gainDownCoef);
      output[i] = input[i] * this.currentGain;
    }
    this.frameCount++;
    if (this.frameCount % 4 === 0) this.port.postMessage({ floor: this.floor, speaking: speaking || this.holdCounter > 0 });
    return true;
  }
}
registerProcessor('voice-gate-processor', VoiceGateProcessor);
`;
let workletModuleReady = false;
async function ensureWorkletModule(ctx) {
  if (workletModuleReady) return true;
  if (!ctx.audioWorklet) return false;
  try {
    const url = URL.createObjectURL(new Blob([NOISE_WORKLET_CODE], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    workletModuleReady = true;
    return true;
  } catch (e) {
    console.warn('AudioWorklet indisponível, usando fallback de ScriptProcessor', e);
    return false;
  }
}

// Mesma lógica do worklet acima, só que rodando na thread principal via
// ScriptProcessorNode — fallback automático pra navegadores sem suporte a AudioWorklet.
function fallbackParamsForMode(mode, floor) {
  switch (mode) {
    case 'low':  return { ratio: 1.6, floorGain: 0.35, holdMs: 300, confirmMs: 8 };
    case 'high': return { ratio: 3.2, floorGain: 0.05, holdMs: 200, confirmMs: 20 };
    case 'auto': {
      const noisy = floor > 0.012, veryNoisy = floor > 0.03;
      return veryNoisy ? { ratio: 3.0, floorGain: 0.08, holdMs: 220, confirmMs: 18 }
        : noisy ? { ratio: 2.4, floorGain: 0.15, holdMs: 250, confirmMs: 14 }
        : { ratio: 1.8, floorGain: 0.30, holdMs: 300, confirmMs: 8 };
    }
    default: return { ratio: 2.2, floorGain: 0.15, holdMs: 260, confirmMs: 14 };
  }
}
function createFallbackGateNode(ctx) {
  const sr = ctx.sampleRate;
  const attackCoef = 1 - Math.exp(-1 / (0.005 * sr));
  const releaseCoef = 1 - Math.exp(-1 / (0.120 * sr));
  const floorAttackCoef = 1 - Math.exp(-1 / (2.0 * sr));
  const floorReleaseCoef = 1 - Math.exp(-1 / (0.4 * sr));
  const gainUpCoef = 1 - Math.exp(-1 / (0.008 * sr));
  const gainDownCoef = 1 - Math.exp(-1 / (0.180 * sr));
  let envelope = 0, floor = 0.003, currentGain = 1, holdCounter = 0, confirmCounter = 0, frame = 0;
  const node = ctx.createScriptProcessor(1024, 1, 1);
  node.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const output = e.outputBuffer.getChannelData(0);
    if (noiseMode === 'off') { output.set(input); return; }
    const p = fallbackParamsForMode(noiseMode, floor);
    const holdMax = Math.round((p.holdMs / 1000) * sr);
    const confirmMax = Math.max(1, Math.round((p.confirmMs / 1000) * sr));
    let speaking = false;
    for (let i = 0; i < input.length; i++) {
      const level = Math.abs(input[i]);
      envelope = level > envelope ? envelope + (level - envelope) * attackCoef : envelope + (level - envelope) * releaseCoef;
      const aboveFloorNow = envelope > floor * p.ratio;
      if (!aboveFloorNow) floor += (envelope - floor) * floorAttackCoef;
      else floor += (Math.min(envelope, floor) - floor) * floorReleaseCoef;
      if (floor < 0.0008) floor = 0.0008;
      const overThreshold = envelope >= floor * p.ratio;
      confirmCounter = overThreshold ? Math.min(confirmCounter + 1, confirmMax) : 0;
      const confirmed = confirmCounter >= confirmMax;
      if (confirmed) { holdCounter = holdMax; speaking = true; }
      else if (holdCounter > 0) holdCounter--;
      const targetGain = (confirmed || holdCounter > 0) ? 1 : p.floorGain;
      currentGain += (targetGain - currentGain) * (targetGain > currentGain ? gainUpCoef : gainDownCoef);
      output[i] = input[i] * currentGain;
    }
    frame++;
    if (frame % 4 === 0) { meterState.floor = floor; meterState.speaking = speaking || holdCounter > 0; }
  };
  return node;
}

function micConstraints() {
  return { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
}
let screenStream = null;  // stream de vídeo (tela), só quando compartilhando
let hasMic = false;
const calls = {};       // peerId -> MediaConnection
const conns = {};       // peerId -> DataConnection (nomes / lista de peers)
const remoteNames = {}; // peerId -> name
const hostConns = {};   // apenas o host usa: peerId -> DataConnection

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2800);
}

function randomRoomCode() {
  const words = ["sol","lua","rio","mar","luz","paz","voo","cha","bao","gato"];
  return words[Math.floor(Math.random()*words.length)] + "-" + Math.floor(1000+Math.random()*9000);
}
$('genRoomBtn').onclick = () => { $('roomInput').value = randomRoomCode(); };

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('room')) $('roomInput').value = urlParams.get('room');

$('joinBtn').onclick = joinCall;

async function joinCall() {
  myName = $('nameInput').value.trim() || "Anônimo";
  roomId = $('roomInput').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (!roomId) { $('status').textContent = "Digite ou gere um código de sala."; return; }

  $('status').textContent = "Pedindo acesso ao microfone...";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
    hasMic = true;
    await setupMicGainChain(localStream);
    refreshMicDeviceList();
  } catch (e) {
    // Não trava a entrada: entra mudo e permite ativar depois, de dentro da sala.
    localStream = new MediaStream();
    hasMic = false;
  }

  $('status').textContent = "Conectando na sala...";
  startPeer();
}

function startPeer() {
  const hostId = "callzinha-" + roomId;
  peer = new Peer(hostId, { debug: 0 });

  peer.on('open', () => {
    isHost = true;
    enterCallUI();
    addLocalTile();
    listenForGuests();
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      peer = new Peer(undefined, { debug: 0 });
      peer.on('open', () => {
        isHost = false;
        enterCallUI();
        addLocalTile();
        connectToHost(hostId);
        peer.on('call', (call) => acceptCall(call));
      });
      peer.on('error', (e2) => { $('status').textContent = "Erro de conexão: " + e2.type; });
    } else {
      $('status').textContent = "Erro de conexão: " + err.type;
    }
  });
}

async function enableMic() {
  const btn = document.getElementById('enableMediaBtn');
  if (btn) { btn.textContent = "Pedindo acesso..."; btn.disabled = true; }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
    hasMic = true; micOn = true;
    await setupMicGainChain(localStream);
    refreshMicDeviceList();
    $('micBtn').textContent = '🎤';
    $('micBtn').classList.add('active'); $('micBtn').classList.remove('off');
    attachVolumeMeter(localStream, 'tile-local');

    // Reconecta as chamadas já existentes agora com áudio de verdade
    rebuildAllCalls();

    const banner = document.getElementById('mediaBanner');
    if (banner) banner.remove();
    toast("Microfone ativado!");
  } catch (e) {
    if (btn) { btn.textContent = "🎤 Ativar microfone"; btn.disabled = false; }
    const reasons = {
      NotAllowedError: "Permissão negada. Clique no cadeado 🔒 ao lado do endereço e permita o microfone.",
      NotFoundError: "Nenhum microfone foi encontrado pelo navegador.",
      NotReadableError: "Outro programa está usando o microfone agora."
    };
    toast(reasons[e.name] || "Não consegui ativar o microfone.");
  }
}

function toggleFullscreen(video) {
  const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  if (video.requestFullscreen) video.requestFullscreen();
  else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS Safari
}

// ---- Picture-in-Picture ----
// Deixa a janela do vídeo (tela compartilhada) flutuando por cima de tudo,

const pipSupported = 'pictureInPictureEnabled' in document && document.pictureInPictureEnabled;

function addPipBtn(tile, video) {
  let btn = tile.querySelector('.pip-btn');

    } catch (err) {
      toast("Não consegui abrir o Picture-in-Picture aqui.");
    }

  video.addEventListener('enterpictureinpicture', () => btn.classList.add('active'));

// ---- HOST: aceita conexões de dados dos convidados, mantém lista, distribui ----
function listenForGuests() {
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      hostConns[conn.peer] = conn;
      conn.send({ type: 'welcome', name: myName });
    });
    conn.on('data', (msg) => handleData(conn.peer, msg));
    conn.on('close', () => {
      delete hostConns[conn.peer];
      broadcastRoster();
      removeRemoteTile(conn.peer);
      if (calls[conn.peer]) { calls[conn.peer].close(); delete calls[conn.peer]; }
    });
  });
  peer.on('call', (call) => acceptCall(call));
}

function broadcastRoster() {
  const roster = Object.keys(hostConns).concat([peer.id]);
  const names = Object.assign({ [peer.id]: myName }, remoteNames);
  for (const id in hostConns) {
    hostConns[id].send({ type: 'roster', peers: roster.filter(p => p !== id), names });
  }
}

// ---- GUEST: conecta no host, recebe lista, conecta com todo mundo (mesh) ----
function connectToHost(hostId) {
  const conn = peer.connect(hostId, { reliable: true });
  conns[hostId] = conn;
  conn.on('open', () => conn.send({ type: 'hello', name: myName }));
  conn.on('data', (msg) => handleData(hostId, msg));
  callPeer(hostId, myName);
}

function handleData(fromId, msg) {
  if (msg.type === 'hello') {
    remoteNames[fromId] = msg.name;
    updateTileName(fromId);
    if (isHost) broadcastRoster();
  } else if (msg.type === 'welcome') {
    remoteNames[fromId] = msg.name;
  } else if (msg.type === 'roster') {
    Object.assign(remoteNames, msg.names);
    updateTileName(fromId);
    (msg.peers || []).forEach(pid => {
      if (pid !== peer.id && !calls[pid]) {
        callPeer(pid, remoteNames[pid]);
        if (!conns[pid]) {
          const c = peer.connect(pid, { reliable: true });
          conns[pid] = c;
          c.on('open', () => c.send({ type: 'hello', name: myName }));
          c.on('data', (m) => handleData(pid, m));
        }
      }
    });
  }
}

function updateTileName(peerId) {
  const tile = document.getElementById('tile-' + peerId);
  if (tile && remoteNames[peerId]) {
    tile.querySelector('.tag').textContent = remoteNames[peerId];
    tile.querySelector('.avatar').textContent = initials(remoteNames[peerId]);
  }
}

// ---- Medidor de volume ----
let audioCtx = null;
const volumeLoops = {};
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function attachVolumeMeter(stream, tileId) {
  if (!stream.getAudioTracks().length) return;
  if (volumeLoops[tileId]) { cancelAnimationFrame(volumeLoops[tileId]); delete volumeLoops[tileId]; }
  const ctx = getAudioCtx();
  const source = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.6;
  source.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function loop() {
    const tile = document.getElementById(tileId);
    if (!tile) { delete volumeLoops[tileId]; return; }
    analyser.getByteFrequencyData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const level = Math.min(1, (sum / data.length) / 55);
    latestLevels[tileId] = level;
    // O medidor lê o mic bruto (antes do mute), então sem isso o indicador de
    // "falando" continuava acendendo mesmo com o mic mutado.
    const displayLevel = (tileId === 'tile-local' && !micOn) ? 0 : level;
    const fill = tile.querySelector('.volfill');
    if (fill) fill.style.width = (displayLevel * 100) + '%';
    tile.classList.toggle('speaking', displayLevel > 0.12);
    volumeLoops[tileId] = requestAnimationFrame(loop);
  }
  loop();
}

function teardownMicChain() {
  [micRawSourceNode, noiseHighpass, voiceGateNode, fallbackGateNode, compressorNode, limiterNode, micGainNode].forEach(n => {
    if (n) { try { n.disconnect(); } catch (e) {} }
  });
  voiceGateNode = null;
  fallbackGateNode = null;
}

async function setupMicGainChain(rawStream) {
  const ctx = getAudioCtx();
  teardownMicChain(); // solta a cadeia anterior (importante ao trocar de microfone)

  const source = ctx.createMediaStreamSource(rawStream);
  micRawSourceNode = source;

  // 1) Corta zumbido/ronco grave contínuo (ventilador, fiação, batida no fio)
  noiseHighpass = ctx.createBiquadFilter();
  noiseHighpass.type = 'highpass';
  noiseHighpass.frequency.value = noiseMode !== 'off' ? 120 : 0;

  // 2) Supressão de ruído + VAD (AudioWorklet quando suportado; ScriptProcessor como fallback)
  const usingWorklet = await ensureWorkletModule(ctx);
  let gateOutput;
  if (usingWorklet) {
    voiceGateNode = new AudioWorkletNode(ctx, 'voice-gate-processor', { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1 });
    voiceGateNode.port.onmessage = (e) => {
      meterState.floor = e.data.floor;
      meterState.speaking = e.data.speaking;
    };
    voiceGateNode.port.postMessage({ type: 'config', mode: noiseMode });
    noiseHighpass.connect(voiceGateNode);
    gateOutput = voiceGateNode;
  } else {
    fallbackGateNode = createFallbackGateNode(ctx);
    noiseHighpass.connect(fallbackGateNode);
    gateOutput = fallbackGateNode;
  }

  // 3) Compressor: nivela a voz (menos picos e vales de volume, sem robotizar)
  compressorNode = ctx.createDynamicsCompressor();
  compressorNode.threshold.value = -24;
  compressorNode.knee.value = 12;
  compressorNode.ratio.value = 3;
  compressorNode.attack.value = 0.01;
  compressorNode.release.value = 0.15;

  // 4) Limiter: teto de segurança contra picos/clipping (normalização final)
  limiterNode = ctx.createDynamicsCompressor();
  limiterNode.threshold.value = -3;
  limiterNode.knee.value = 0;
  limiterNode.ratio.value = 20;
  limiterNode.attack.value = 0.001;
  limiterNode.release.value = 0.05;

  micGainNode = ctx.createGain();
  micGainNode.gain.value = micOn ? micVolumePercent / 100 : 0;

  mixDestination = ctx.createMediaStreamDestination();

  source.connect(noiseHighpass);
  gateOutput.connect(compressorNode);
  compressorNode.connect(limiterNode);
  limiterNode.connect(micGainNode);
  micGainNode.connect(mixDestination);

  micOutputStream = mixDestination.stream;

  attachVolumeMeter(rawStream, 'tile-local');
  startNoisePanelMeterLoop();
}

// Pluga o áudio da tela/aba compartilhada na MESMA saída do microfone,
// pra sair tudo misturado num único trilho de áudio (mais confiável entre navegadores
// do que mandar dois trilhos de áudio separados).
function attachScreenAudio(stream) {
  detachScreenAudio();
  const audioTracks = stream.getAudioTracks();
  if (!audioTracks.length || !mixDestination) return;
  const ctx = getAudioCtx();
  const screenAudioStream = new MediaStream(audioTracks);
  screenAudioSource = ctx.createMediaStreamSource(screenAudioStream);
  screenAudioGain = ctx.createGain();
  screenAudioGain.gain.value = 1;
  screenAudioSource.connect(screenAudioGain);
  screenAudioGain.connect(mixDestination);
}

function detachScreenAudio() {
  if (screenAudioSource) { try { screenAudioSource.disconnect(); } catch (e) {} screenAudioSource = null; }
  if (screenAudioGain) { try { screenAudioGain.disconnect(); } catch (e) {} screenAudioGain = null; }
}

function setNoiseMode(mode) {
  noiseMode = mode;
  document.querySelectorAll('#noiseModes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (noiseHighpass) noiseHighpass.frequency.value = mode !== 'off' ? 120 : 0;
  if (voiceGateNode) voiceGateNode.port.postMessage({ type: 'config', mode });
  $('noiseBtn').classList.toggle('noise-on', mode !== 'off');
  $('noiseBtn').textContent = mode !== 'off' ? '🔉' : '🔈';
}
document.querySelectorAll('#noiseModes button').forEach(b => {

});

// ---- Seleção de microfone ----
async function refreshMicDeviceList() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    const sel = $('micDeviceSelect');
    if (!sel) return;
    const current = selectedMicDeviceId || sel.value;
    sel.innerHTML = '';
    mics.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || ('Microfone ' + (i + 1));
      sel.appendChild(opt);
    });
    if (mics.some(d => d.deviceId === current)) sel.value = current;
  } catch (e) {}
}
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', refreshMicDeviceList);
}
$('micDeviceSelect').onchange = (e) => { if (e.target.value) switchMicDevice(e.target.value); };

async function switchMicDevice(deviceId) {
  try {
    toast("Trocando microfone...");
    const constraints = Object.assign(micConstraints(), { deviceId: { exact: deviceId } });
    const newStream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = newStream;
    selectedMicDeviceId = deviceId;
    hasMic = true;
    await setupMicGainChain(localStream);
    if (Object.keys(calls).length) rebuildAllCalls();
    toast("Microfone trocado!");
  } catch (e) {
    toast("Não consegui trocar pra esse microfone.");
  }
}

// ---- Medidores em tempo real (MIC / RUÍDO / VOZ) ----
let noisePanelMeterRAF = null;
function startNoisePanelMeterLoop() {
  if (noisePanelMeterRAF) return;
  function loop() {
    if ($('noisePanel').classList.contains('show')) {
      const micLevel = latestLevels['tile-local'] || 0;
      const mm = $('meterMic'), mn = $('meterNoise'), mv = $('meterVoice');
      if (mm) mm.style.width = Math.min(1, micLevel * 1.4) * 100 + '%';
      if (mn) mn.style.width = Math.min(1, meterState.floor * 25) * 100 + '%';
      if (mv) mv.style.width = (meterState.speaking ? Math.min(1, micLevel * 1.6) : Math.min(1, micLevel * 0.3)) * 100 + '%';
    }
    noisePanelMeterRAF = requestAnimationFrame(loop);
  }
  loop();
}

// ---- Teste de microfone: grava original x processado em paralelo (~3s) ----
$('micTestBtn').onclick = runMicTest;
async function runMicTest() {
  if (!hasMic || !localStream) { toast("Ative o microfone primeiro."); return; }
  const ctx = getAudioCtx();
  const btn = $('micTestBtn');
  btn.disabled = true;
  btn.textContent = "🔴 Gravando 3s (fale, bata no teclado, ligue o ventilador)...";

  const rawDest = ctx.createMediaStreamDestination();
  const procDest = ctx.createMediaStreamDestination();
  if (micTestRawSource) { try { micTestRawSource.disconnect(); } catch (e) {} }
  micTestRawSource = ctx.createMediaStreamSource(localStream);
  micTestRawSource.connect(rawDest);
  if (limiterNode) limiterNode.connect(procDest);

  const recA = new MediaRecorder(rawDest.stream);
  const recB = new MediaRecorder(procDest.stream);
  const chunksA = [], chunksB = [];
  recA.ondataavailable = (e) => { if (e.data.size) chunksA.push(e.data); };
  recB.ondataavailable = (e) => { if (e.data.size) chunksB.push(e.data); };
  const doneA = new Promise((res) => { recA.onstop = res; });
  const doneB = new Promise((res) => { recB.onstop = res; });

  recA.start(); recB.start();
  await new Promise((res) => setTimeout(res, 3000));
  recA.stop(); recB.stop();
  await Promise.all([doneA, doneB]);

  try { micTestRawSource.disconnect(); } catch (e) {}
  if (limiterNode) { try { limiterNode.disconnect(procDest); } catch (e) {} }

  if (micTestOriginalUrl) URL.revokeObjectURL(micTestOriginalUrl);
  if (micTestProcessedUrl) URL.revokeObjectURL(micTestProcessedUrl);
  micTestOriginalUrl = URL.createObjectURL(new Blob(chunksA, { type: 'audio/webm' }));
  micTestProcessedUrl = URL.createObjectURL(new Blob(chunksB, { type: 'audio/webm' }));

  btn.disabled = false;
  btn.textContent = "🎙️ Testar de novo";
  $('micTestResult').style.display = 'block';
}
$('playOriginalBtn').onclick = () => { if (micTestOriginalUrl) new Audio(micTestOriginalUrl).play(); };
$('playProcessedBtn').onclick = () => { if (micTestProcessedUrl) new Audio(micTestProcessedUrl).play(); };

function outgoingStream() {
  // micOutputStream já sai com mic + áudio da tela (se houver) misturados num só trilho.
  // Só falta juntar o vídeo da tela, quando estiver compartilhando.
  const tracks = [];
  if (micOutputStream) tracks.push(...micOutputStream.getAudioTracks());
  if (sharingScreen && screenStream) tracks.push(...screenStream.getVideoTracks());
  return new MediaStream(tracks);
}

function callPeer(peerId, name) {
  if (calls[peerId] || peerId === peer.id) return;
  const call = peer.call(peerId, outgoingStream(), { metadata: { name: myName, sharing: sharingScreen } });
  calls[peerId] = call;
  wireCall(call, name);
}

function acceptCall(call) {
  call.answer(outgoingStream());
  calls[call.peer] = call;
  const theirName = (call.metadata && call.metadata.name) || remoteNames[call.peer];
  wireCall(call, theirName);
}

function wireCall(call, name) {
  call.on('stream', (remoteStream) => {
    const video = addRemoteTile(call.peer, name || remoteNames[call.peer]);
    video.srcObject = remoteStream;
    const hasVideo = remoteStream.getVideoTracks().length > 0;
    video.classList.toggle('has-video', hasVideo);
    const tile = document.getElementById('tile-' + call.peer);
    if (tile) tile.querySelector('.screen-badge')?.remove();
    if (hasVideo && tile) {
      const badge = document.createElement('div');
      badge.className = 'screen-badge';
      badge.textContent = '🖥️ compartilhando tela';
      badge.style.display = 'block';
      tile.appendChild(badge);
    }
    if (tile) {
      addFullscreenBtn(tile, video).classList.toggle('show', hasVideo);
      addPipBtn(tile, video).classList.toggle('show', hasVideo);
    }
    attachVolumeMeter(remoteStream, 'tile-' + call.peer);
  });
  call.on('close', () => { removeRemoteTile(call.peer); delete calls[call.peer]; });
}

function rebuildAllCalls() {
  const ids = Object.keys(calls);
  ids.forEach(id => { calls[id].close(); delete calls[id]; });
  ids.forEach(id => callPeer(id, remoteNames[id]));
}

// ---- Controles ----
let micOn = true, sharingScreen = false;

$('micBtn').onclick = () => {
  if (!hasMic) { enableMic(); return; }
  micOn = !micOn;
  if (micGainNode) micGainNode.gain.value = micOn ? micVolumePercent / 100 : 0;
  $('micBtn').classList.toggle('active', micOn);
  $('micBtn').classList.toggle('off', !micOn);
  $('micBtn').textContent = micOn ? '🎤' : '🔇';
};

$('screenBtn').onclick = async () => {
  if (!sharingScreen) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    } catch (e) { return; }
    sharingScreen = true;
    const localTile = $('tile-local');
    const localVideo = document.querySelector('#tile-local video');
    localVideo.srcObject = screenStream;
    localVideo.classList.add('has-video');
    addFullscreenBtn(localTile, localVideo).classList.add('show');
    addPipBtn(localTile, localVideo).classList.add('show');
    $('screenBtn').classList.add('active');
    attachScreenAudio(screenStream);
    rebuildAllCalls();
    if (screenStream.getAudioTracks().length) {
      toast("Compartilhando sua tela (com áudio)");
    } else {
      toast("Compartilhando sua tela (sem áudio — marque \"Compartilhar áudio\" na janela de seleção pra levar o som junto)");
    }
    screenStream.getVideoTracks()[0].onended = stopScreenShare;
  } else {
    stopScreenShare();
  }
};

function stopScreenShare() {
  if (screenStream) screenStream.getTracks().forEach(t => t.stop());
  detachScreenAudio();
  sharingScreen = false;
  const localVideo = document.querySelector('#tile-local video');
  localVideo.srcObject = null;
  localVideo.classList.remove('has-video');
  const localTile = $('tile-local');
  localTile?.querySelector('.fs-btn')?.classList.remove('show');
  localTile?.querySelector('.pip-btn')?.classList.remove('show');
  if (document.pictureInPictureElement === localVideo) document.exitPictureInPicture().catch(() => {});
  $('screenBtn').classList.remove('active');
  rebuildAllCalls();
  toast("Parou de compartilhar a tela");
}

$('leaveBtn').onclick = () => {
  if (confirm("Sair da chamada?")) location.reload();
};

// Atalho de teclado: M para mutar/desmutar (funciona enquanto a aba estiver em foco)
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.target.isContentEditable) return;
  const inCall = $('callScreen').offsetParent !== null; // true se estiver visível na tela
  if (!inCall) return;
  if (e.key === 'm' || e.key === 'M' || e.code === 'KeyM') {
    e.preventDefault();
    $('micBtn').click();
  }
});

window.onbeforeunload = () => { if (peer) peer.destroy(); };
</script>
</body>
</html>
