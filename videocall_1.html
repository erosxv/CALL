<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallZinha - Chamada em grupo</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #eaeaea;
    min-height: 100vh;
  }
  /* ---- Tela de entrada ---- */
  #joinScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  #joinScreen h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  #joinScreen p.sub {
    color: #9aa0a6;
    margin-bottom: 28px;
    text-align: center;
  }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 380px;
  }
  .card label {
    display: block;
    font-size: 13px;
    color: #9aa0a6;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .card label:first-child { margin-top: 0; }
  .card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e37;
    background: #0f1115;
    color: #eaeaea;
    font-size: 15px;
  }
  .card input:focus { outline: 2px solid #5b8cff; }
  .row-btns { display: flex; gap: 10px; margin-top: 22px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    transition: opacity .15s ease;
  }
  button:hover { opacity: .88; }
  button:active { opacity: .7; }
  .btn-primary { background: #5b8cff; color: white; flex: 1; }
  .btn-ghost { background: #2a2e37; color: #eaeaea; }
  #genRoomBtn { width: 100%; margin-top: 6px; }
  #status { margin-top: 16px; font-size: 13px; color: #9aa0a6; text-align: center; min-height: 18px; }

  /* ---- Tela da chamada ---- */
  #callScreen { display: none; min-height: 100vh; flex-direction: column; }
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #14161c;
    border-bottom: 1px solid #2a2e37;
  }
  #topbar .roomInfo { font-size: 14px; color: #9aa0a6; }
  #topbar .roomInfo b { color: #eaeaea; }
  #copyLinkBtn { background: #2a2e37; color: #eaeaea; font-size: 13px; padding: 8px 12px; }

  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    padding: 16px;
    overflow-y: auto;
    align-content: start;
  }
  .tile {
    position: relative;
    background: #14161c;
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 16/10;
    border: 1px solid #2a2e37;
  }
  .tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    transform: scaleX(1);
  }
  .tile.mine video { transform: scaleX(-1); }
  .tile .tag {
    position: absolute;
    left: 10px;
    bottom: 10px;
    background: rgba(0,0,0,.55);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .tile .muted-badge {
    position: absolute;
    right: 10px;
    top: 10px;
    background: rgba(220,50,50,.85);
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 12px;
    display: none;
  }

  #controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: #14161c;
    border-top: 1px solid #2a2e37;
  }
  .ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #2a2e37;
    color: #eaeaea;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .ctrl-btn.off { background: #d64545; }
  .ctrl-btn.active { background: #5b8cff; }
  .ctrl-btn.leave { background: #d64545; }
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1d24;
    border: 1px solid #2a2e37;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

<div id="joinScreen">
  <h1>📞 CallZinha</h1>
  <p class="sub">Chamada em grupo com tela compartilhada, sem instalar nada</p>
  <div class="card">
    <label for="nameInput">Seu nome</label>
    <input id="nameInput" placeholder="Ex: João" maxlength="20">
    <label for="roomInput">Código da sala</label>
    <input id="roomInput" placeholder="Ex: turma-do-cafe" maxlength="40">
    <button id="genRoomBtn" class="btn-ghost">🎲 Gerar código novo</button>
    <div class="row-btns">
      <button id="joinBtn" class="btn-primary">Entrar na chamada</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="callScreen">
  <div id="topbar">
    <div class="roomInfo">Sala: <b id="roomLabel"></b> &nbsp;•&nbsp; <span id="peerCount">1</span> na chamada</div>
    <button id="copyLinkBtn">🔗 Copiar link de convite</button>
  </div>
  <div id="grid"></div>
  <div id="controls">
    <button id="micBtn" class="ctrl-btn active" title="Mutar/desmutar">🎤</button>
    <button id="camBtn" class="ctrl-btn active" title="Ligar/desligar câmera">📷</button>
    <button id="screenBtn" class="ctrl-btn" title="Compartilhar tela">🖥️</button>
    <button id="leaveBtn" class="ctrl-btn leave" title="Sair">📵</button>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let myName = "";
let roomId = "";
let peer = null;
let isHost = false;
let localStream = null;
let screenStream = null;
let cameraTrack = null;
const calls = {};       // peerId -> MediaConnection
const conns = {};       // peerId -> DataConnection (for names / peer-list gossip)
const remoteNames = {}; // peerId -> name
const hostConns = {};   // used only by host: peerId -> DataConnection

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2500);
}

function randomRoomCode() {
  const words = ["sol","lua","rio","mar","luz","paz","voo","cha","bao","gato"];
  return words[Math.floor(Math.random()*words.length)] + "-" + Math.floor(1000+Math.random()*9000);
}
$('genRoomBtn').onclick = () => { $('roomInput').value = randomRoomCode(); };

// Pre-fill from URL (?room=xxx)
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('room')) $('roomInput').value = urlParams.get('room');

$('joinBtn').onclick = joinCall;

function showPermissionHelp(err) {
  const name = err && err.name;
  let title, tip;

  if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
    title = "🚫 Permissão de câmera/microfone bloqueada";
    tip = "Clique no ícone de cadeado 🔒 ao lado do endereço do site (lá em cima) → mude Câmera e Microfone para <b>Permitir</b> → recarregue a página.";
  } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
    title = "🎥 Nenhuma câmera/microfone encontrado";
    tip = "O navegador não achou nenhum dispositivo. Confira se a webcam está conectada corretamente.";
  } else if (name === 'NotReadableError' || name === 'TrackStartError') {
    title = "⚠️ Câmera ou microfone em uso";
    tip = "Outro programa (Zoom, Teams, Meet em outra aba...) já está usando a câmera/microfone. Feche esses programas e tente de novo.";
  } else {
    title = "❌ Não consegui acessar câmera/microfone";
    tip = "Pode ser bloqueio do sistema operacional. No Windows, procure por \"privacidade da câmera\" no menu iniciar e ative \"Permitir que aplicativos de desktop acessem sua câmera\" (e o mesmo para microfone).";
  }

  $('status').innerHTML =
    '<div style="text-align:left;background:#20161a;border:1px solid #d64545;border-radius:10px;padding:12px 14px;margin-top:6px;">' +
    '<b>' + title + '</b><div style="margin-top:6px;color:#eaeaea;font-size:13px;line-height:1.5;">' + tip + '</div></div>' +
    '<button id="retryPermBtn" class="btn-primary" style="width:100%;margin-top:12px;">🔄 Tentar novamente</button>';

  document.getElementById('retryPermBtn').onclick = joinCall;
}

async function joinCall() {
  myName = $('nameInput').value.trim() || "Anônimo";
  roomId = $('roomInput').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (!roomId) { $('status').textContent = "Digite ou gere um código de sala."; return; }

  $('status').innerHTML = "Pedindo acesso à câmera/microfone...";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (e) {
    showPermissionHelp(e);
    return;
  }
  cameraTrack = localStream.getVideoTracks()[0];

  $('status').textContent = "Conectando na sala...";
  startPeer();
}

function startPeer() {
  // Try to become the "host" (deterministic id = room name). If taken, join as guest.
  const hostId = "callzinha-" + roomId;
  peer = new Peer(hostId, { debug: 0 });

  peer.on('open', (id) => {
    isHost = true;
    enterCallUI();
    addLocalTile();
    listenForGuests();
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      // room already has a host -> join as a guest with random id
      peer = new Peer(undefined, { debug: 0 });
      peer.on('open', () => {
        isHost = false;
        enterCallUI();
        addLocalTile();
        connectToHost(hostId);
        listenForIncomingCalls();
      });
      peer.on('error', (e2) => {
        $('status').textContent = "Erro de conexão: " + e2.type;
      });
    } else {
      $('status').textContent = "Erro de conexão: " + err.type;
    }
  });
}

function enterCallUI() {
  $('joinScreen').style.display = 'none';
  $('callScreen').style.display = 'flex';
  $('roomLabel').textContent = roomId;
}

$('copyLinkBtn').onclick = () => {
  const link = location.origin + location.pathname + "?room=" + encodeURIComponent(roomId);
  navigator.clipboard.writeText(link).then(() => toast("Link copiado! Manda pra galera 🎉"));
};

function addLocalTile() {
  const tile = document.createElement('div');
  tile.className = 'tile mine';
  tile.id = 'tile-local';
  const video = document.createElement('video');
  video.autoplay = true; video.muted = true; video.playsInline = true;
  video.srcObject = localStream;
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = myName + " (você)";
  tile.appendChild(video); tile.appendChild(tag);
  $('grid').appendChild(tile);
  updateCount();
}

function updateCount() {
  $('peerCount').textContent = $('grid').children.length;
}

function addRemoteTile(peerId, name) {
  if (document.getElementById('tile-' + peerId)) return;
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.id = 'tile-' + peerId;
  const video = document.createElement('video');
  video.autoplay = true; video.playsInline = true;
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = name || "Participante";
  tile.appendChild(video); tile.appendChild(tag);
  $('grid').appendChild(tile);
  updateCount();
  return video;
}

function removeRemoteTile(peerId) {
  const tile = document.getElementById('tile-' + peerId);
  if (tile) tile.remove();
  updateCount();
}

// ---- HOST logic: accept guest data-connections, keep a roster, broadcast peer list ----
function listenForGuests() {
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      hostConns[conn.peer] = conn;
      conn.send({ type: 'welcome', name: myName });
    });
    conn.on('data', (msg) => handleData(conn.peer, msg));
    conn.on('close', () => {
      delete hostConns[conn.peer];
      broadcastRoster();
      removeRemoteTile(conn.peer);
      if (calls[conn.peer]) { calls[conn.peer].close(); delete calls[conn.peer]; }
    });
  });
  peer.on('call', (call) => acceptCall(call));
}

function broadcastRoster() {
  const roster = Object.keys(hostConns).concat([peer.id]);
  const names = Object.assign({ [peer.id]: myName }, remoteNames);
  for (const id in hostConns) {
    hostConns[id].send({ type: 'roster', peers: roster.filter(p => p !== id), names });
  }
}

// ---- GUEST logic: connect to host, receive roster, mesh-connect to everyone ----
function connectToHost(hostId) {
  const conn = peer.connect(hostId, { reliable: true });
  conns[hostId] = conn;
  conn.on('open', () => {
    conn.send({ type: 'hello', name: myName });
  });
  conn.on('data', (msg) => handleData(hostId, msg));
  callPeer(hostId, myName);
}

function handleData(fromId, msg) {
  if (msg.type === 'hello') {
    remoteNames[fromId] = msg.name;
    if (isHost) broadcastRoster();
  } else if (msg.type === 'welcome') {
    remoteNames[fromId] = msg.name;
  } else if (msg.type === 'roster') {
    Object.assign(remoteNames, msg.names);
    updateTileName(fromId);
    (msg.peers || []).forEach(pid => {
      if (pid !== peer.id && !calls[pid]) {
        callPeer(pid, remoteNames[pid]);
        if (!conns[pid]) {
          const c = peer.connect(pid, { reliable: true });
          conns[pid] = c;
          c.on('open', () => c.send({ type: 'hello', name: myName }));
          c.on('data', (m) => handleData(pid, m));
        }
      }
    });
  }
}

function updateTileName(peerId) {
  const tile = document.getElementById('tile-' + peerId);
  if (tile && remoteNames[peerId]) {
    tile.querySelector('.tag').textContent = remoteNames[peerId];
  }
}

function callPeer(peerId, name) {
  if (calls[peerId] || peerId === peer.id) return;
  const call = peer.call(peerId, localStream, { metadata: { name: myName } });
  calls[peerId] = call;
  call.on('stream', (remoteStream) => {
    const video = addRemoteTile(peerId, name || remoteNames[peerId]);
    if (video) video.srcObject = remoteStream;
  });
  call.on('close', () => { removeRemoteTile(peerId); delete calls[peerId]; });
}

function listenForIncomingCalls() {
  peer.on('call', (call) => acceptCall(call));
}

function acceptCall(call) {
  call.answer(localStream);
  calls[call.peer] = call;
  const theirName = (call.metadata && call.metadata.name) || remoteNames[call.peer];
  call.on('stream', (remoteStream) => {
    const video = addRemoteTile(call.peer, theirName);
    if (video) video.srcObject = remoteStream;
  });
  call.on('close', () => { removeRemoteTile(call.peer); delete calls[call.peer]; });

  // Host also needs to open a data connection back if guest connected only via call
  if (isHost && !hostConns[call.peer]) {
    // handled by 'connection' event too; nothing extra needed here
  }
}

// ---- Controls ----
let micOn = true, camOn = true, sharingScreen = false;

$('micBtn').onclick = () => {
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  $('micBtn').classList.toggle('active', micOn);
  $('micBtn').classList.toggle('off', !micOn);
  $('micBtn').textContent = micOn ? '🎤' : '🔇';
};

$('camBtn').onclick = () => {
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  $('camBtn').classList.toggle('active', camOn);
  $('camBtn').classList.toggle('off', !camOn);
  $('camBtn').textContent = camOn ? '📷' : '🚫';
};

$('screenBtn').onclick = async () => {
  if (!sharingScreen) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    } catch (e) { return; }
    const screenTrack = screenStream.getVideoTracks()[0];
    replaceOutgoingVideoTrack(screenTrack);
    document.getElementById('tile-local').querySelector('video').srcObject = screenStream;
    sharingScreen = true;
    $('screenBtn').classList.add('active');
    toast("Compartilhando sua tela");
    screenTrack.onended = stopScreenShare;
  } else {
    stopScreenShare();
  }
};

function stopScreenShare() {
  if (screenStream) screenStream.getTracks().forEach(t => t.stop());
  replaceOutgoingVideoTrack(cameraTrack);
  document.getElementById('tile-local').querySelector('video').srcObject = localStream;
  sharingScreen = false;
  $('screenBtn').classList.remove('active');
  toast("Voltou pra câmera");
}

function replaceOutgoingVideoTrack(newTrack) {
  for (const id in calls) {
    const pc = calls[id].peerConnection;
    if (!pc) continue;
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) sender.replaceTrack(newTrack);
  }
}

$('leaveBtn').onclick = () => {
  if (confirm("Sair da chamada?")) location.reload();
};

window.onbeforeunload = () => { if (peer) peer.destroy(); };
</script>
</body>
</html>
